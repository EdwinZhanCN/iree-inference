[package]
name = "iree-sys"
description = "Hand-written raw FFI bindings to the IREE runtime C API (inference subset, IREE 3.14-based fork)."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
links = "iree_runtime_unified"
build = "build.rs"

[features]
metal = []
vulkan = []
cuda = []

[build-dependencies]
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
