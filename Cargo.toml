[workspace]
members = [
    "crates/iree-sys",
    "crates/iree-runtime",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.metadata.iree]
# Base release for the Python tooling and source snapshot for the runtime.
version = "3.14.0"
repository = "https://github.com/EdwinZhanCN/iree.git"
commit = "4ff3621d17896ee7b23d246a355ad915b9219a9e"

# Tests: light optimisation only, so builds stay fast and stay debuggable.
# Heavy compute (the embedding model on IREE) is C built by CMake in Release, unaffected.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 1

[workspace.dependencies]
iree-sys = { path = "crates/iree-sys" }
